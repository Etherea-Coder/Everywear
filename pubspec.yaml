name: everywear
description: A new Flutter project.
publish_to: none
version: 1.0.0-beta.1+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  supabase_flutter: ^2.9.1
  sizer: ^3.1.3
  flutter_svg: ^2.0.9
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  web: ^1.1.1
  path: ^1.9.0
  
  cached_network_image: ^3.3.1
  connectivity_plus: ^7.1.1
  dio: ^5.4.0
  fl_chart: ^1.2.0
  flutter_slidable: ^4.0.3
  camera: ^0.12.0+1
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  percent_indicator: ^4.2.5
  intl: ^0.20.2
  path_provider: ^2.1.2
  http: ^1.6.0
  universal_html: ^2.2.4
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.1
  shimmer: ^3.0.0
  flutter_image_compress: ^2.3.0
  sentry_flutter: ^9.20.0
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  share_plus: ^12.0.2
  purchases_flutter: ^10.1.0
  purchases_ui_flutter: ^10.1.0
  pdf: ^3.11.0
  image: 4.5.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.1
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

# image 4.11.0 still calls ZLibDecoder.decodeLazy, which archive 4.0.9
# removed. Keep dependency resolution reproducible until image updates.
dependency_overrides:
  # image 4.11.0 was selected transitively but calls an archive API that is
  # absent from its declared archive release. This older compatible pair is
  # used by Flutter 3.35/Dart 3.9 and is covered by the image tests.
  image: 4.5.4
  archive: 3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/everywear-icon-v1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/everywear-icon-v1.png"
