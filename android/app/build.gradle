plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def everywearStagingTestApplication = project.findProperty("everywearStagingTestApplication") == "true"
def everywearApplicationId = everywearStagingTestApplication ? "com.stylewise.app.stagingtest" : "com.stylewise.app"
def everywearNamespace = everywearApplicationId
def everywearAppLabel = project.findProperty("everywearAppLabel") ?: (everywearStagingTestApplication ? "Everywear UI Smoke Test (STAGING)" : "everywear")
def hasUploadSigning = keystorePropertiesFile.exists()
if (hasUploadSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // Flutter's integration-test runner falls back to the namespace when it
    // cannot identify the built APK before launching it. Keep this aligned
    // with the application ID so teardown cannot target the normal app.
    namespace = everywearNamespace
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        languageVersion = "2.1"
        apiVersion = "2.1"
    }

    defaultConfig {
        // Preserve this identity until Play Console and RevenueCat registrations
        // are confirmed. Changing it would create a different Android app.
        applicationId = everywearApplicationId
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        manifestPlaceholders.put("everywearAppLabel", everywearAppLabel)
    }

    signingConfigs {
        if (hasUploadSigning) {
            upload {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasUploadSigning) {
                signingConfig signingConfigs.upload
            } else {
                logger.warn("Release signing disabled: android/key.properties is absent")
            }
        }
    }
}

tasks.register("printEverywearApplicationId") {
    doLast {
        println("EVERYWEAR_APPLICATION_ID=${android.defaultConfig.applicationId}")
        println("EVERYWEAR_NAMESPACE=${android.namespace}")
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.1.0'
}
