allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    plugins.withId("com.android.library") {
        android {
            compileSdk = 36
        }
    }
}

subprojects {
    // Ensure every Kotlin module compiles at languageVersion 1.8+ so that
    // third-party modules compiled with older kotlinc (e.g. sentry_flutter with
    // languageVersion 1.6) do not fail when Kotlin 2.2.0 stdlib is on the
    // classpath.
    afterEvaluate { proj ->
        proj.plugins.withId('org.jetbrains.kotlin.android') {
            proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all { task ->
                task.compilerOptions.languageVersion.convention(
                    org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
                )
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir}
