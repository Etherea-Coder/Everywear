allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    plugins.withId("com.android.library") {
        android {
            compileSdk = 36
        }
    }
}

subprojects {
    // Ensure every Kotlin module compiles at languageVersion 1.8+ so that
    // third-party modules compiled with older kotlinc (e.g. sentry_flutter with
    // languageVersion 1.6) do not fail when Kotlin 2.2.0 stdlib is on the
    // classpath.
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            def androidExt = project.extensions.getByName("android")
            if (androidExt) {
                androidExt.kotlinOptions.languageVersion = "1.8"
                androidExt.kotlinOptions.apiVersion = "1.8"
                androidExt.kotlinOptions.jvmTarget = "1.8"
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all { task ->
                task.compilerOptions.languageVersion = "1.8"
                task.compilerOptions.apiVersion = "1.8"
                task.compilerOptions.jvmTarget = "1.8"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir}
